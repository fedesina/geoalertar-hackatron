<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GeoAlertAR Demo - NASA Space Apps</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">

  <!-- Librerías -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Papa Parse para CSV -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    :root { --panel-width: 384px; }
    html, body { height: 100vh; overflow: hidden; font-family: Inter, system-ui, sans-serif; }
    #map { width: 100%; height: 100%; background: #1f2937; }
    .info-panel { width: var(--panel-width); max-height: calc(100% - 2rem); }
    .highlighted-feature { stroke: #00ffff !important; stroke-width: 3 !important; stroke-opacity: 1 !important; }
    .kpi { border: 1px solid #e5e7eb; border-radius: 10px; padding: 10px; }
    .kpi .label { color: #6b7280; font-size: 12px; }
    .kpi .value { font-weight: 700; font-size: 18px; }
    .table { width:100%; border-collapse: collapse; }
    .table th { text-align:left; font-size:12px; color:#6b7280; font-weight:600; padding:6px 8px; }
    .table td { font-size:14px; padding:6px 8px; border-top:1px solid #f1f5f9; }
    .coords-bar { position: absolute; left: 8px; bottom: 8px; z-index: 1000; background: rgba(255,255,255,.85); backdrop-filter: blur(4px); padding: 4px 8px; border-radius: 6px; font-size: 12px; color:#111827; }
  </style>
</head>
<body class="bg-gray-800">
  <div id="map"></div>
  <!-- Coordenadas del puntero -->
  <div id="map-coords" class="coords-bar">Lat: — | Lon: —</div>

  <aside class="info-panel absolute top-4 left-4 z-[1000] bg-white/80 backdrop-blur-sm p-4 rounded-lg shadow-2xl flex flex-col space-y-4">
    <header>
      <h1 class="text-2xl font-bold text-gray-900">🔥 GeoAlertAR Demo</h1>
      <p class="text-sm text-gray-600">Análisis de Riesgo de Incendios - Córdoba, AR</p>
    </header>

    <div class="flex-grow overflow-y-auto pr-2 space-y-3">
      <details open>
        <summary class="font-semibold text-gray-800 cursor-pointer">Niveles de Riesgo</summary>
        <div id="risk-filters" class="grid grid-cols-2 gap-x-4 gap-y-2 text-sm pt-2"></div>
      </details>

      <details>
        <summary class="font-semibold text-gray-800 cursor-pointer">Capas de Contexto</summary>
        <div id="layer-controls" class="space-y-2 text-sm pt-2"></div>
      </details>
    </div>

    <div class="border-t pt-3">
      <button onclick="showAboutModal()" class="w-full text-sm bg-gray-200 text-gray-800 px-3 py-2 rounded-md hover:bg-gray-300">📖 Sobre el Proyecto</button>
    </div>
  </aside>

  <!-- Modal -->
  <div id="modal-bg" class="hidden fixed inset-0 bg-black/50 z-[2000] flex items-center justify-center p-4">
    <div id="modal-content" class="bg-white rounded-lg shadow-xl w-full max-w-3xl overflow-y-auto" style="max-height: calc(100vh - 4rem);"></div>
  </div>

  <script>
    // ---------------- CONFIG ----------------
    const CONFIG = {
      GEOJSON_URL: 'riesgo_hexagonos.geojson',
      MAP_CENTER: [-32.0, -64.0],
      MAP_ZOOM: 8,
      RISK_LEVELS: {
        "CRÍTICO": { color: "#ef4444" },
        "ALTO": { color: "#f97316" },
        "MODERADO": { color: "#facc15" },
        "BAJO": { color: "#22c55e" },
        "DATOS INSUFICENTES": { color: "#9ca3af" }
      },
      CONTEXT_LAYERS: [
        { name: 'Áreas Protegidas', file: 'layers/Areas_Protegidas_Poligono.geojson', style: { color: "#16a34a", weight: 2, opacity: 0.8, fillOpacity: 0.15 } },
        { name: 'Cuarteles de Bomberos', file: 'layers/Cuartel_Bomberos_Punto.geojson' },
        { name: 'Comunidades Indígenas', file: 'layers/Comunidades_Indigenas_CBA.geojson' },
        { 
          name: 'Curvas de Nivel',
          file: 'layers/Curvas_Nivel_CBA.geojson',
          style: (feature) => {
            const z = feature?.properties?.ELEV ?? feature?.properties?.elev ?? feature?.properties?.contour ?? 0;
            let color = '#d1d5db';
            if (z > 2000) color = '#1f2937';
            else if (z > 1500) color = '#4b5563';
            else if (z > 1000) color = '#6b7280';
            else if (z > 500) color = '#9ca3af';
            return { color, weight: 1, opacity: 0.7 };
          }
        }
      ],
      // Capas CSV opcionales
      CSV_LAYERS: [
        { name: 'Cobertura de Suelo (CSV)', file: 'layers/sd_cobertura_suelo.csv' }
      ],
      // NUEVO: CSV de humedad por hexágono (campo: Humedad_mean)
      HUMEDAD_HEX_CSV: 'layers/Humedad_por_hexagono.csv'
    };

    // ---------------- MAPA & CAPAS ----------------
    const mapLayers = { context: {}, csv: {}, pins: L.layerGroup() };
    let hexLayer, highlightedFeature;

    // NUEVO: cache y referencias para la humedad por hex
    let hexGeoData = null;   // GeoJSON de hex cargado
    let humedadLayer = null; // capa choropleth
    let humedadLegend = null;// leyenda

    const map = L.map('map').setView(CONFIG.MAP_CENTER, CONFIG.MAP_ZOOM);

    // Bases: sin NASA, con "ESRI Híbrido"
    L.control.layers({
      "ESRI Satélite": L.tileLayer(
        'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
        { attribution: '© Esri, Maxar, Earthstar Geographics' }
      ).addTo(map),
      "ESRI Híbrido": L.layerGroup([
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: '© Esri, Maxar, Earthstar Geographics' }),
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', { attribution: '© Esri', opacity: 0.9 })
      ]),
      "Mapa Oscuro": L.tileLayer('https://basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { attribution: '© CartoDB' }),
      "Calles": L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' })
    }).addTo(map);

    // Escala gráfica
    L.control.scale({ metric: true, imperial: false }).addTo(map);

    // Coordenadas del puntero
    map.on('mousemove', (e) => {
      const el = document.getElementById('map-coords');
      el.textContent = `Lat: ${e.latlng.lat.toFixed(5)} | Lon: ${e.latlng.lng.toFixed(5)}`;
    });

    document.addEventListener('DOMContentLoaded', async () => {
      await loadHexData();
      await loadContextLayers();
      await loadCsvLayers();
      await loadHumedadHex();    // <-- NUEVO: arma la capa coropleta desde el CSV
      buildLayerControls();
    });

    // ---------------- HEXÁGONOS (riesgo) ----------------
    async function loadHexData() {
      const response = await fetch(CONFIG.GEOJSON_URL);
      const data = await response.json();

      hexGeoData = data; // <-- cache para unir con CSV de humedad

      hexLayer = L.geoJSON(data, {
        style: f => ({
          fillColor: CONFIG.RISK_LEVELS[f.properties.nivel]?.color || '#333',
          weight: 1, opacity: 0.5, color: 'white', fillOpacity: 0.7
        }),
        onEachFeature: (f, layer) => {
          if (f.geometry.type === 'Polygon') {
            const c = layer.getBounds().getCenter();
            L.circleMarker(c, { radius: 2, fillColor: "white", fillOpacity: 0.8, color: "black", weight: 1, interactive: false }).addTo(mapLayers.pins);
          }
          layer.on({
            click: () => {
              if (highlightedFeature) hexLayer.resetStyle(highlightedFeature);
              highlightedFeature = layer;
              layer.setStyle({ className: 'highlighted-feature' }).bringToFront();
              showReportModal(f.properties, layer.getBounds().getCenter());
            }
          });
        }
      }).addTo(map);
      mapLayers.pins.addTo(map);
      buildRiskFilters();
    }

    function buildRiskFilters() {
      const c = document.getElementById('risk-filters');
      c.innerHTML = Object.keys(CONFIG.RISK_LEVELS).map(l =>
        `<label class="flex items-center space-x-2 cursor-pointer">
          <input type="checkbox" checked class="risk-toggle h-4 w-4 rounded" data-level="${l}" style="accent-color:${CONFIG.RISK_LEVELS[l].color};">
          <span>${l}</span>
        </label>`).join('');
      c.addEventListener('change', () => {
        const active = Array.from(document.querySelectorAll('.risk-toggle:checked')).map(cb => cb.dataset.level);
        let pinsVisible = false;
        hexLayer.eachLayer(layer => {
          const isVisible = active.includes(layer.feature.properties.nivel);
          layer.setStyle({ fillOpacity: isVisible ? 0.7 : 0, opacity: isVisible ? 0.5 : 0, interactive: isVisible });
          if (isVisible) pinsVisible = true;
        });
        pinsVisible ? map.addLayer(mapLayers.pins) : map.removeLayer(mapLayers.pins);
      });
    }

    // ---------------- CAPAS CONTEXTO (GeoJSON) ----------------
    async function loadContextLayers() {
      for (const info of CONFIG.CONTEXT_LAYERS) {
        try {
          const res = await fetch(info.file);
          const json = await res.json();
          const label = (p) => p?.nombre ?? p?.comunidad_ ?? p?.ELEV ?? p?.contour ?? 'Elemento';
          mapLayers.context[info.name] = L.geoJSON(json, {
            style: info.style,
            pointToLayer: (f, latlng) => {
              const iconHtml = info.name === 'Comunidades Indígenas' ? '🌿' : info.name.includes('Bomberos') ? '🚒' : '📍';
              return L.marker(latlng, { icon: L.divIcon({ html: iconHtml, className: 'text-2xl', iconSize: [24,24] }) })
                      .bindTooltip(label(f.properties));
            },
            onEachFeature: (f, l) => l.bindTooltip(label(f.properties))
          });
        } catch { mapLayers.context[info.name] = null; }
      }
    }

    // ---------------- CAPAS CSV (puntos) ----------------
    function detectLatLon(headers) {
      const latCandidates = ['lat','latitude','LAT','Lat','y','Y','latitud','Latitud'];
      const lonCandidates = ['lon','lng','long','LONGITUDE','Lon','x','X','longitud','Longitud'];
      const found = { latField: null, lonField: null };
      for (const h of headers) {
        const k = (h||'').toString().trim();
        if (!found.latField && latCandidates.includes(k)) found.latField = h;
        if (!found.lonField && lonCandidates.includes(k)) found.lonField = h;
      }
      return found;
    }

    async function loadCsvLayers() {
      for (const info of (CONFIG.CSV_LAYERS || [])) {
        try {
          const res = await fetch(info.file);
          const text = await res.text();
          const parsed = Papa.parse(text, { header: true, dynamicTyping: true, skipEmptyLines: true });
          const rows = parsed.data;
          const headers = parsed.meta.fields || Object.keys(rows[0] || {});
          const { latField: autoLat, lonField: autoLon } = detectLatLon(headers);

          const latField = info.latField || autoLat;
          const lonField = info.lonField || autoLon;
          if (!latField || !lonField) { console.warn(`[CSV] ${info.name}: no hay columnas lat/lon`); mapLayers.csv[info.name] = null; continue; }
          const labelField = info.labelField && headers.includes(info.labelField) ? info.labelField : (headers.includes('label') ? 'label' : null);

          const feats = [];
          for (const r of rows) {
            const lat = Number(r[latField]), lon = Number(r[lonField]);
            if (Number.isFinite(lat) && Number.isFinite(lon)) {
              feats.push({ type: 'Feature', geometry: { type: 'Point', coordinates: [lon, lat] }, properties: r });
            }
          }
          const gj = { type: 'FeatureCollection', features: feats };
          mapLayers.csv[info.name] = L.geoJSON(gj, {
            pointToLayer: (f, latlng) => {
              const m = L.circleMarker(latlng, { radius: 5, color: '#2563eb', weight: 2, fillColor: '#60a5fa', fillOpacity: 0.7 });
              const label = labelField ? `${f.properties[labelField]}` : 'Cobertura de suelo';
              const extra = Object.entries(f.properties).slice(0, 6).map(([k,v]) => `<div><b>${k}</b>: ${v}</div>`).join('');
              return m.bindTooltip(label).bindPopup(`<div class="text-sm">${label}${extra?'<hr/>'+extra:''}</div>`);
            }
          });

        } catch (err) { console.error(`[CSV] Error cargando ${info.name}:`, err); mapLayers.csv[info.name] = null; }
      }
    }

    // ---------------- HUMEDAD POR HEX (choropleth desde CSV) ----------------
    async function loadHumedadHex() {
      try {
        const res = await fetch(CONFIG.HUMEDAD_HEX_CSV);
        const text = await res.text();
        const parsed = Papa.parse(text, { header: true, dynamicTyping: true, skipEmptyLines: true });
        const rows = parsed.data;

        // columnas: id, Humedad_mean (según tu CSV)
        const idCol = 'id';
        const valCol = 'Humedad_mean';

        const mapIdToValue = new Map();
        const values = [];
        for (const r of rows) {
          const id = String(r[idCol]).trim();
          const val = Number(r[valCol]);
          if (id && Number.isFinite(val)) {
            mapIdToValue.set(id, val);
            values.push(val);
          }
        }
        if (!values.length || !hexGeoData) {
          console.warn('[HumedadHex] No hay valores o no se cargó el GeoJSON.');
          return;
        }

        const min = Math.min(...values);
        const max = Math.max(...values);

        const colorFor = (v) => {
          const t = Math.max(0, Math.min(1, (v - min) / (max - min)));
          const stops = ['#2563eb', '#22c55e', '#facc15', '#f97316', '#7c3e0a']; // azul->verde->amarillo->naranja->marrón
          const idx = Math.min(stops.length - 2, Math.floor(t * (stops.length - 1)));
          const lerp = (a,b,p)=>Math.round(a + (b-a)*p);
          const hex2rgb = h => h.match(/[0-9a-f]{2}/gi).map(x=>parseInt(x,16));
          const [r1,g1,b1] = hex2rgb(stops[idx].replace('#',''));
          const [r2,g2,b2] = hex2rgb(stops[idx+1].replace('#',''));
          const p = (t * (stops.length - 1)) - idx;
          return `rgb(${lerp(r1,r2,p)},${lerp(g1,g2,p)},${lerp(b1,b2,p)})`;
        };

        const feats = [];
        for (const f of hexGeoData.features) {
          const pid = String(f.properties.id ?? f.properties.ID ?? f.properties.hex_id ?? '').trim();
          if (!pid) continue;
          const val = mapIdToValue.get(pid);
          if (val == null) continue;
          feats.push({
            type: 'Feature',
            geometry: f.geometry,
            properties: { ...f.properties, humedad_mean: val }
          });
        }

        const gj = { type: 'FeatureCollection', features: feats };
        humedadLayer = L.geoJSON(gj, {
          style: ft => ({
            fillColor: colorFor(ft.properties.humedad_mean),
            color: '#ffffff',
            weight: 0.5,
            opacity: 0.8,
            fillOpacity: 0.6
          }),
          onEachFeature: (ft, layer) => {
            const v = ft.properties.humedad_mean;
            layer.bindTooltip(`Humedad media: ${v.toFixed(1)}`);
          }
        });

        // Leyenda
        if (humedadLegend) { try { humedadLegend.remove(); } catch {} humedadLegend = null; }
        humedadLegend = L.control({ position: 'bottomright' });
        humedadLegend.onAdd = () => {
          const div = L.DomUtil.create('div', 'humedad-legend');
          div.style.background = 'rgba(255,255,255,0.9)';
          div.style.padding = '8px 10px';
          div.style.borderRadius = '8px';
          div.style.boxShadow = '0 1px 6px rgba(0,0,0,.15)';
          div.style.fontSize = '12px';
          const samples = 60;
          const stops = Array.from({length: samples}, (_,i) => {
            const v = min + (i/(samples-1))*(max-min);
            return colorFor(v);
          });
          const gradient = `linear-gradient(to right, ${stops.join(',')})`;
          div.innerHTML = `
            <div style="font-weight:600;margin-bottom:6px;">Humedad de Suelo (media)</div>
            <div style="width:220px;height:12px;border-radius:6px;background:${gradient};border:1px solid #e5e7eb;"></div>
            <div style="display:flex;justify-content:space-between;margin-top:4px;">
              <span>${min.toFixed(1)}</span><span>${max.toFixed(1)}</span>
            </div>`;
          return div;
        };

        // Registrar para que aparezca como "contexto" (toggle)
        mapLayers.context['Humedad de Suelo (hex)'] = humedadLayer;
      } catch (err) {
        console.error('[HumedadHex] Error:', err);
        humedadLayer = null;
      }
    }

    // ---------------- CONTROLES ----------------
    function buildLayerControls() {
      const c = document.getElementById('layer-controls');

      const ctxHtml = Object.keys(CONFIG.CONTEXT_LAYERS.reduce((acc, l) => (acc[l.name]=true, acc), {})).map(name => {
        const layerObj = CONFIG.CONTEXT_LAYERS.find(x => x.name === name);
        const isReady = !!mapLayers.context[name];
        return `<label class="flex items-center space-x-2 ${isReady?'cursor-pointer':'text-gray-400'}">
          <input type="checkbox" class="context-toggle h-4 w-4 rounded" data-name="${name}" ${!isReady?'disabled':''}>
          <span>${name}</span>
        </label>`;
      }).join('');

      // incluir también la humedad si está disponible
      const extraContext = Object.keys(mapLayers.context).filter(n => !CONFIG.CONTEXT_LAYERS.find(x => x.name === n));
      const extraHtml = extraContext.map(name =>
        `<label class="flex items-center space-x-2 ${mapLayers.context[name]?'cursor-pointer':'text-gray-400'}">
          <input type="checkbox" class="context-toggle h-4 w-4 rounded" data-name="${name}" ${!mapLayers.context[name]?'disabled':''}>
          <span>${name}</span>
        </label>`).join('');

      const csvHtml = (CONFIG.CSV_LAYERS||[]).map(l =>
        `<label class="flex items-center space-x-2 ${mapLayers.csv[l.name]?'cursor-pointer':'text-gray-400'}">
          <input type="checkbox" class="csv-toggle h-4 w-4 rounded" data-name="${l.name}" ${!mapLayers.csv[l.name]?'disabled':''}>
          <span>${l.name}</span>
        </label>`).join('');

      c.innerHTML = ctxHtml + extraHtml + (csvHtml ? `<div class="mt-2 border-t pt-2">${csvHtml}</div>` : '');

      c.addEventListener('change', e => {
        const el = e.target;

        // Contexto (GeoJSON + humedad hex)
        if (el.classList.contains('context-toggle')) {
          const name = el.dataset.name, layer = mapLayers.context[name];
          if (!layer) return;

          if (name === 'Curvas de Nivel') {
            const show = map.getZoom() >= 10;
            if (el.checked && show) map.addLayer(layer);
            else map.removeLayer(layer);
          } else {
            el.checked ? map.addLayer(layer) : map.removeLayer(layer);
          }

          // leyenda de humedad
          if (name === 'Humedad de Suelo (hex)') {
            if (el.checked && humedadLegend) humedadLegend.addTo(map);
            else if (humedadLegend) humedadLegend.remove();
          }
        }

        // CSV puntos
        if (el.classList.contains('csv-toggle')) {
          const name = el.dataset.name, layer = mapLayers.csv[name];
          if (!layer) return;
          el.checked ? map.addLayer(layer) : map.removeLayer(layer);
        }
      });
    }

    // Mostrar/ocultar Curvas según zoom
    map.on('zoomend', () => {
      const curvas = mapLayers.context['Curvas de Nivel'];
      const cb = document.querySelector('.context-toggle[data-name="Curvas de Nivel"]');
      if (!curvas || !cb) return;
      const show = map.getZoom() >= 10;
      if (show && cb.checked && !map.hasLayer(curvas)) map.addLayer(curvas);
      if (!show && map.hasLayer(curvas)) map.removeLayer(curvas);
    });

    // ---------------- MODAL: REPORTE ----------------
    const modalBg=document.getElementById('modal-bg');
    const openModal=()=>modalBg.classList.remove('hidden','opacity-0');
    const closeModal=()=>{modalBg.classList.add('opacity-0');setTimeout(()=>modalBg.classList.add('hidden'),300);};
    window.closeModal=closeModal;

    function copyToClipboard(text) { navigator.clipboard?.writeText(text); }

    function showReportModal(p, centerLatLng) {
      if (p.nivel==='DATOS INSUFICENTES') return;

      const riskColor = CONFIG.RISK_LEVELS[p.nivel]?.color ?? "#000";
      const saocom = p.humedad_saocom_pct!=null ? `${p.humedad_saocom_pct.toFixed(1)}%` : 'No disponible';
      const resumen = p.nivel==="CRÍTICO" ? "Condiciones extremadamente secas/calurosas. Riesgo máximo."
                    : p.nivel==="ALTO" ? "Vegetación seca y clima desfavorable."
                    : p.nivel==="MODERADO" ? "Condiciones mixtas, riesgo controlado."
                    : "Condiciones húmedas, bajo riesgo.";

      const lat = centerLatLng?.lat?.toFixed?.(5) ?? '—';
      const lon = centerLatLng?.lng?.toFixed?.(5) ?? '—';
      const coordStr = `${lat}, ${lon}`;

      document.getElementById('modal-content').innerHTML = `
        <div class="p-6 space-y-4">
          <div class="flex justify-between items-start">
            <h2 class="text-2xl font-bold flex items-center gap-2">🔎 Zona ${p.nombre || '#' + p.id}</h2>
            <button onclick="closeModal()" class="text-3xl leading-none">&times;</button>
          </div>

          <div class="rounded-lg p-4 text-white" style="background:${riskColor}dd;">
            <div class="flex items-center justify-between">
              <div class="text-xl font-semibold">RIESGO GENERAL <span class="ml-2 px-2 py-0.5 rounded-full bg-white/30 text-white font-semibold text-xs">${p.nivel}</span></div>
              <div class="text-3xl font-extrabold">${(p.riesgo_final?.toFixed?.(1) ?? 0)}%</div>
            </div>
            <p class="text-sm mt-1">${resumen}</p>
          </div>

          <div class="grid md:grid-cols-3 gap-3">
            <div class="kpi"><div class="label">NDVI</div><div class="value">${p.ndvi?.toFixed?.(3) ?? '—'}</div></div>
            <div class="kpi"><div class="label">NBR</div><div class="value">${p.nbr?.toFixed?.(3) ?? '—'}</div></div>
            <div class="kpi"><div class="label">Temp. (LST)</div><div class="value">${p.lst_celsius?.toFixed?.(1) ?? '—'} °C</div></div>
          </div>

          <div class="grid md:grid-cols-2 gap-4">
            <div class="p-3 rounded-lg border">
              <div class="font-semibold mb-2">📍 Ubicación</div>
              <table class="table">
                <tr><th>Centroide</th><td>${coordStr} <button onclick="copyToClipboard('${coordStr}')" class="ml-2 text-xs px-2 py-1 bg-gray-100 rounded hover:bg-gray-200">Copiar</button></td></tr>
                <tr><th>Hexágono</th><td>${p.nombre || ('#'+p.id)}</td></tr>
                <tr><th>Fecha</th><td>${p.fecha ?? '—'}</td></tr>
              </table>
            </div>

            <div class="p-3 rounded-lg border">
              <div class="font-semibold mb-2">🌦️ Condiciones</div>
              <table class="table">
                <tr><th>Humedad mínima</th><td>${p.humedad_min ?? '—'} %</td></tr>
                <tr><th>Viento máx.</th><td>${p.viento_max_kmh ?? '—'} km/h</td></tr>
                <tr><th>Prec. 60d</th><td>${p.precip_60d_mm?.toFixed?.(1) ?? '—'} mm</td></tr>

              </table>
            </div>
          </div>

          <div class="border rounded-lg p-3">
            <div class="font-semibold mb-2">🧪 Metodología (resumen)</div>
            <p class="text-sm text-gray-700">

              inspirado en buenas prácticas (p. ej., FWI) y adaptado a condiciones regionales.
              Validado contra <b>registros históricos</b> del SNMF y reportes de incendios en Córdoba.
            </p>
          </div>
        </div>`;
      openModal();
    }
